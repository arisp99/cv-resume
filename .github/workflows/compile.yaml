name: Build LaTeX documents

on:
  workflow_dispatch:
  push:
    paths:
      - "cv.tex"
      - "cv/**"
      - "resume.tex"
      - "resume/**"
      - "awesome-cv.cls"
      - "awesome-cv.bbx"
      - "publications.bib"
  pull_request:
    paths:
      - "cv.tex"
      - "cv/**"
      - "resume.tex"
      - "resume/**"
      - "awesome-cv.cls"
      - "awesome-cv.bbx"
      - "publications.bib"

jobs:
  build-latex:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install fonts
        run: |
          apt-get update
          apt-get install --yes fonts-roboto fonts-adobe-sourcesans3

      - name: Compile LaTeX documents
        run: make -B

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pdf-files
          path: |
            cv.pdf
            resume.pdf
          if-no-files-found: error
